version: 2
updates:
  - package-ecosystem: npm            # also handles pnpm-lock.yaml
    directory: /
    schedule: { interval: weekly }
    # Matches pnpm-workspace.yaml's 7-day minimumReleaseAge, or installs would fail.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies: { dependency-type: development, update-types: [minor, patch] }
      dependencies: { dependency-type: production, update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
